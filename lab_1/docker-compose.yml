services:
  spark-master:
    image: apache/spark:python3
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MASTER_HOST=spark-master
    ports:
      - "8080:8080" 
      - "7077:7077" 
      - "4040:4040" 
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.master.Master"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "7077"
      - "--webui-port"
      - "8080"
    volumes:
      - ./:/workspace
    networks:
      - spark-network

  spark-worker-1:
    image: apache/spark:python3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
    volumes:
      - ./:/workspace
    networks:
      - spark-network

  spark-worker-2:
    image: apache/spark:python3
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
    volumes:
      - ./:/workspace
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge