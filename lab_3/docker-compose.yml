services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    image: lab3-spark:latest
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.master.Master"
      - "--host"
      - "spark-master"
      - "--port"
      - "7077"
      - "--webui-port"
      - "8080"
    volumes:
      - ./:/workspace
    networks:
      - spark-network

  spark-worker-1:
    image: lab3-spark:latest
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 3g
    ports:
      - "8081:8081"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
    volumes:
      - ./:/workspace
    networks:
      - spark-network

  spark-worker-2:
    image: lab3-spark:latest
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 3g
    ports:
      - "8082:8081"
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
    volumes:
      - ./:/workspace
    networks:
      - spark-network

  tensorflow:
    build:
      context: .
      dockerfile: Dockerfile.tf
    image: lab3-tf:latest
    container_name: tensorflow
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ./:/workspace
    networks:
      - spark-network

networks:
  spark-network:
    driver: bridge
